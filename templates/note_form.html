{% extends "base.html" %}

{% block title %}{% if note %}Edit Note{% else %}New Note{% endif %} - LocalNotes{% endblock %}

{% block content %}
<div class="note-form-container">
    <h2>{% if note %}Edit Note{% else %}New Note{% endif %}</h2>
    
    <form action="{% if note %}{{ url_for('edit_note', note_id=note.id) }}{% else %}{{ url_for('new_note') }}{% endif %}" method="post" class="note-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{% if note %}{{ note.title }}{% endif %}" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="12">{% if note %}{{ note.content }}{% endif %}</textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
